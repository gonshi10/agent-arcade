<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Arcade</title>
<link rel="stylesheet" href="shell.css">
<script>
  // Returning-user shortcut: if we already know which game you play and the
  // URL isn't explicitly asking for the picker (?pick=1), skip straight to it.
  (function () {
    try {
      var qs = window.location.search || "";
      var KNOWN = ["snake", "dino", "breakout", "pong", "2048"];
      if (qs.indexOf("pick") === -1) {
        var last = window.localStorage.getItem("agent-arcade:lastGame");
        if (last && KNOWN.indexOf(last) !== -1) {
          window.location.replace("/games/" + last + ".html");
        }
      }
    } catch (e) {
      /* localStorage unavailable — fall through to the picker */
    }
  })();
</script>
<style>
  /* Page-scoped layout for the picker grid only — colors/fonts come from shell.css tokens. */
  body{ justify-content:flex-start; padding-top:56px; padding-bottom:56px; }

  .top{ width:100%; max-width:760px; text-align:center; }
  .top h1{
    margin:0 0 10px; font-size:26px; letter-spacing:.06em; font-weight:600;
  }
  .top h1 .dot{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 10px var(--accent); margin-right:10px;
    vertical-align:middle;
  }
  .top p{ margin:0; color:var(--dim); font-size:13px; line-height:1.6; }

  .grid{
    width:100%; max-width:760px; display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;
  }

  .card{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:100%; font-family:var(--mono); text-align:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:24px 16px; cursor:pointer; color:var(--ink);
    transition:border-color .12s, transform .12s, box-shadow .12s;
  }
  .card:hover, .card:focus-visible{
    border-color:var(--accent); transform:translateY(-3px);
    box-shadow:0 8px 24px rgba(55,224,160,.12); outline:none;
  }
  .card .icon{ font-size:38px; line-height:1; }
  .card .name{ font-size:14px; letter-spacing:.04em; font-weight:600; }
  .card .blurb{ margin:0; color:var(--dim); font-size:11.5px; line-height:1.5; }

  .foot{
    width:100%; max-width:760px; color:var(--dim); font-size:11px;
    line-height:1.6; text-align:center;
  }
</style>
</head>
<body>

  <header class="top">
    <h1><span class="dot"></span>Agent Arcade</h1>
    <p>Play a game while your Claude Code agent works — pick one below.<br>
      We'll freeze the action and pull you back the instant it needs you.</p>
  </header>

  <div id="overlay" class="overlay standalone">
    <span class="pill" id="ovpill">—</span>
    <h1 id="ovtitle">—</h1>
    <p id="ovbody">—</p>
    <button id="btnAck" class="ctl" type="button">Got it</button>
  </div>

  <main class="grid" id="grid">
    <button type="button" class="card" data-id="snake">
      <span class="icon">🐍</span>
      <span class="name">Snake</span>
      <p class="blurb">Classic wraparound snake. Eat, grow, don't hit yourself.</p>
    </button>
    <button type="button" class="card" data-id="dino">
      <span class="icon">🦖</span>
      <span class="name">Dino Runner</span>
      <p class="blurb">Endless side-scroller. Jump and duck the obstacles.</p>
    </button>
    <button type="button" class="card" data-id="breakout">
      <span class="icon">🧱</span>
      <span class="name">Breakout</span>
      <p class="blurb">Paddle and ball. Clear every brick.</p>
    </button>
    <button type="button" class="card" data-id="pong">
      <span class="icon">🏓</span>
      <span class="name">Pong</span>
      <p class="blurb">Defend the wall. Survive an endless rally.</p>
    </button>
    <button type="button" class="card" data-id="2048">
      <span class="icon">🔢</span>
      <span class="name">2048</span>
      <p class="blurb">Slide and merge tiles to chase a high score.</p>
    </button>
  </main>

  <p class="foot">
    Your pick is remembered for next time — every game has a
    <kbd>⌂ Change game</kbd> link to come back here.
  </p>

<script src="shell.js"></script>
<script>
  (function () {
    var grid = document.getElementById("grid");
    grid.addEventListener("click", function (e) {
      var card = e.target.closest(".card");
      if (!card) return;
      var id = card.getAttribute("data-id");
      try { window.localStorage.setItem("agent-arcade:lastGame", id); } catch (e) {}
      window.location.href = "/games/" + id + ".html";
    });

    // No game/HUD on this page — just the alert half of the shell, so the
    // agent can still yank you back while you're deciding what to play.
    var ov = Shell.overlayController({
      overlay: document.getElementById("overlay"),
      title: document.getElementById("ovtitle"),
      body: document.getElementById("ovbody"),
      pill: document.getElementById("ovpill"),
    });
    document.getElementById("btnAck").addEventListener("click", function () {
      ov.hide();
    });
    Shell.watch({
      onTransition: function (s) {
        if (s.agent === "waiting") {
          ov.set("alert", "⚠  Agent needs you", (s.reason || "Permission or input required.") + "  ·  Pick a game, or dismiss.", "needs you");
        } else if (s.agent === "done") {
          ov.set("done", "✓  Agent finished", "Turn complete. Streak: " + s.elapsed.toFixed(1) + "s · " + s.tools + " tools.", "finished");
        } else {
          ov.hide();
        }
      },
    });
  })();
</script>

</body>
</html>
